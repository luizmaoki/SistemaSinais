# Local development only; run as a separate project (capitaloidc).
# These fixture users and HTTP endpoints must never be deployed publicly.
services:
  keycloak:
    build:
      context: .
      dockerfile: infra/docker/keycloak.Dockerfile
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HOSTNAME: http://localhost:18080
      KC_BOOTSTRAP_ADMIN_USERNAME: capital-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set a local administrator password in .env.oidc.local}
    ports: ["127.0.0.1:18080:8080"]
    volumes: ["keycloak_data:/opt/keycloak/data"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; cat <&3 | grep -q UP'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  api:
    ports: !override ["127.0.0.1:18000:8000"]
    environment: &oidc_env
      AUTH_MODE: oidc
      OIDC_ISSUER: http://localhost:18080/realms/capital
      OIDC_INTERNAL_BASE_URL: http://keycloak:8080/realms/capital
      OIDC_CLIENT_ID: capital-web
      AUTH_PUBLIC_BASE_URL: http://localhost:13000
      SESSION_COOKIE_SECURE: "false"
      CORS_ORIGINS: http://localhost:13000
      SEC_USER_AGENT: ""
      COINBASE_PERSONAL_USE_ACCEPTED: "false"
    depends_on:
      keycloak: {condition: service_healthy}
  worker:
    environment: *oidc_env
  web:
    ports: !override ["127.0.0.1:13000:3000"]
    environment:
      PUBLIC_APP_ORIGINS: http://localhost:13000
volumes:
  keycloak_data:

